syntax = "proto3";

package tiny.v1.erp;

// ============================================================
// ERP Common Messages — Shared across all ERP modules
// ============================================================

// ─── Pagination ─────────────────────────────────────────────

// 列表查询的分页请求参数
message PageRequest {
  int32 offset = 1;         // 偏移量（从0开始）
  int32 limit = 2;          // 每页数量（默认20，最大100）
  optional string sort_by = 3;      // 排序字段
  optional bool sort_desc = 4;      // 是否降序
}

// 列表查询的分页响应元数据
message PageResponse {
  int32 total = 1;          // 总记录数
  int32 offset = 2;         // 当前偏移量
  int32 limit = 3;          // 当前每页数量
  bool has_more = 4;        // 是否有更多数据
}

// ─── Money ──────────────────────────────────────────────────

// 金额值（用于精确的货币计算，避免浮点数精度问题）
message MoneyValue {
  string amount = 1;        // 金额字符串（使用 Decimal 格式，如 "1234.56"）
  string currency_code = 2; // 货币代码（ISO 4217，如 "CNY", "USD"）
}

// ─── Filters ────────────────────────────────────────────────

// 通用日期范围过滤器
message DateRange {
  optional string start = 1;   // 起始日期 (ISO 8601 格式)
  optional string end = 2;     // 结束日期 (ISO 8601 格式)
}

// 通用搜索/过滤请求（嵌入到各模块的 List 请求中）
message SearchFilter {
  optional string search_query = 1;    // 全文搜索关键词
  repeated FilterField fields = 2;     // 字段过滤条件
}

// 单个字段过滤条件
message FilterField {
  string field = 1;               // 字段名（支持 dot-notation，如 "partner.name"）
  string operator = 2;            // 操作符: eq, ne, gt, gte, lt, lte, like, in, not_in, is_null, is_not_null
  repeated string values = 3;     // 过滤值列表（in/not_in 使用多个值，其他取第一个）
}

// ─── Audit ──────────────────────────────────────────────────

// ERP 文档审计字段（扩展 sys.AuditInfo，增加 ERP 特有字段）
message ErpAuditInfo {
  string created_at = 1;
  string updated_at = 2;
  optional string created_by = 3;
  optional string updated_by = 4;
  optional string company_id = 5;      // 公司ID（多公司场景）
  optional int32 version = 6;          // 乐观锁版本号
}

// ─── Document Workflow ──────────────────────────────────────

// 文档操作（用于状态机驱动的文档流转）
enum DocumentAction {
  DOCUMENT_ACTION_UNSPECIFIED = 0;
  DOCUMENT_ACTION_CONFIRM = 1;     // 确认
  DOCUMENT_ACTION_CANCEL = 2;      // 取消
  DOCUMENT_ACTION_LOCK = 3;        // 锁定
  DOCUMENT_ACTION_UNLOCK = 4;      // 解锁
  DOCUMENT_ACTION_RESET_DRAFT = 5; // 重置为草稿
  DOCUMENT_ACTION_DONE = 6;        // 完成
}

// 文档状态变更请求
message DocumentActionRequest {
  string id = 1;                        // 文档ID
  string tenant_id = 2;                 // 租户ID
  DocumentAction action = 3;            // 操作类型
  optional string reason = 4;           // 操作原因（取消时使用）
}

// 文档状态变更响应
message DocumentActionResponse {
  bool success = 1;
  string new_state = 2;                 // 变更后的状态
  optional string message = 3;          // 操作消息
}

// ─── Header-Line Pattern ────────────────────────────────────

// 订单行操作类型（用于增量更新场景）
enum LineOperation {
  LINE_OPERATION_UNSPECIFIED = 0;
  LINE_OPERATION_CREATE = 1;
  LINE_OPERATION_UPDATE = 2;
  LINE_OPERATION_DELETE = 3;
}

// 空响应（用于删除等无返回值的操作）
message EmptyResponse {}
