syntax = "proto3";

package tiny.v1.erp.base;

// ============================================================
// ERP Base Module — Currency, Country, Bank, Sequence, Company
// ============================================================
// PartnerService 已拆出至 partner.proto（包 tiny.v1.erp.partner），
// 见 tiny openspec change extract-partner-proto。

// ─── Currency ───────────────────────────────────────────────

service CurrencyService {
  rpc GetCurrency(GetCurrencyRequest) returns (GetCurrencyResponse);
  rpc ListCurrencies(ListCurrenciesRequest) returns (ListCurrenciesResponse);
  rpc GetCurrencyByCode(GetCurrencyByCodeRequest) returns (GetCurrencyByCodeResponse);
}

message Currency {
  string id = 1;
  string name = 2;
  optional int32 iso_numeric = 3;
  optional string full_name = 4;
  string symbol = 5;
  optional double rounding = 6;
  optional int32 decimal_places = 7;
  bool active = 8;
  optional string position = 9;
  optional string currency_unit_label = 10;
  optional string currency_subunit_label = 11;
  string created_at = 12;
  string updated_at = 13;
  int32 version = 14;
}

message GetCurrencyRequest { string id = 1; }
message GetCurrencyByCodeRequest { string code = 1; }
message ListCurrenciesRequest {}
message GetCurrencyResponse { Currency currency = 1; }
message GetCurrencyByCodeResponse { Currency currency = 1; }
message ListCurrenciesResponse { repeated Currency currencies = 1; }

// ─── Country ────────────────────────────────────────────────

service CountryService {
  rpc GetCountry(GetCountryRequest) returns (GetCountryResponse);
  rpc ListCountries(ListCountriesRequest) returns (ListCountriesResponse);
  rpc GetCountryByCode(GetCountryByCodeRequest) returns (GetCountryByCodeResponse);
  rpc ListCountryStates(ListCountryStatesRequest) returns (ListCountryStatesResponse);
}

message Country {
  string id = 1;
  string name = 2;
  string code = 3;
  optional string address_format = 4;
  optional string currency_id = 5;
  optional int32 phone_code = 6;
  bool state_required = 7;
  bool zip_required = 8;
  bool active = 9;
  int32 version = 10;
}

message CountryState {
  string id = 1;
  string country_id = 2;
  string name = 3;
  string code = 4;
  bool active = 5;
  int32 version = 6;
}

message GetCountryRequest { string id = 1; }
message GetCountryByCodeRequest { string code = 1; }
message ListCountriesRequest {}
message ListCountryStatesRequest { string country_id = 1; }
message GetCountryResponse { Country country = 1; }
message GetCountryByCodeResponse { Country country = 1; }
message ListCountriesResponse { repeated Country countries = 1; }
message ListCountryStatesResponse { repeated CountryState states = 1; }

// ─── Bank ───────────────────────────────────────────────────

service BankService {
  rpc GetBank(GetBankRequest) returns (GetBankResponse);
  rpc SaveBank(SaveBankRequest) returns (SaveBankResponse);
  rpc ListBanks(ListBanksRequest) returns (ListBanksResponse);
  rpc GetBankByBic(GetBankByBicRequest) returns (GetBankByBicResponse);
}

message Bank {
  string id = 1;
  string name = 2;
  optional string street = 3;
  optional string street2 = 4;
  optional string zip = 5;
  optional string city = 6;
  optional string state = 7;
  optional string country = 8;
  optional string email = 9;
  optional string phone = 10;
  bool active = 11;
  optional string bic = 12;
  string created_at = 13;
  string updated_at = 14;
  int32 version = 15;
}

message GetBankRequest { string id = 1; }
message GetBankByBicRequest { string bic = 1; }
message ListBanksRequest {}
message SaveBankRequest {
  string name = 1;
  optional string id = 2;
  optional string street = 3;
  optional string street2 = 4;
  optional string zip = 5;
  optional string city = 6;
  optional string state = 7;
  optional string country = 8;
  optional string email = 9;
  optional string phone = 10;
  bool active = 11;
  optional string bic = 12;
  int32 version = 13;
}
message GetBankResponse { Bank bank = 1; }
message SaveBankResponse { Bank bank = 1; }
message GetBankByBicResponse { Bank bank = 1; }
message ListBanksResponse { repeated Bank banks = 1; }

// ─── Sequence ───────────────────────────────────────────────

service SequenceService {
  rpc GetSequence(GetSequenceRequest) returns (GetSequenceResponse);
  rpc ListSequences(ListSequencesRequest) returns (ListSequencesResponse);
  rpc NextSequenceValue(NextSequenceValueRequest) returns (NextSequenceValueResponse);
}

message Sequence {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  optional string code = 4;
  optional string implementation = 5;
  bool active = 6;
  optional string prefix = 7;
  optional string suffix = 8;
  int32 number_next = 9;
  int32 number_increment = 10;
  int32 padding = 11;
  bool use_date_range = 12;
  string created_at = 13;
  string updated_at = 14;
  int32 version = 15;
}

message GetSequenceRequest { string id = 1; }
message ListSequencesRequest { string tenant_id = 1; }
message NextSequenceValueRequest {
  string tenant_id = 1;
  string code = 2;
}
message GetSequenceResponse { Sequence sequence = 1; }
message ListSequencesResponse { repeated Sequence sequences = 1; }
message NextSequenceValueResponse { string formatted_value = 1; }

// ─── Company (multi-company, res.company equivalent) ────────

service CompanyService {
  rpc CreateCompany(CreateCompanyRequest) returns (CreateCompanyResponse);
  rpc UpdateCompany(UpdateCompanyRequest) returns (UpdateCompanyResponse);
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);
  rpc ArchiveCompany(ArchiveCompanyRequest) returns (ArchiveCompanyResponse);
}

message CompanyDto {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  bool active = 4;
  int32 sequence = 5;
  optional string parent_id = 6;
  optional string parent_path = 7;
  optional string root_id = 8;
  optional string partner_id = 9;
  optional string currency_id = 10;
  optional string company_registry = 11;
  int32 version = 12;
}

message CreateCompanyRequest {
  string tenant_id = 1;
  string name = 2;
  optional string parent_id = 3;
  optional string currency_id = 4;
  optional string company_registry = 5;
}
message CreateCompanyResponse { CompanyDto company = 1; }

message UpdateCompanyRequest {
  string tenant_id = 1;
  string id = 2;
  optional string name = 3;
  optional string currency_id = 4;
  optional string company_registry = 5;
}
message UpdateCompanyResponse { CompanyDto company = 1; }

message GetCompanyRequest {
  string tenant_id = 1;
  string id = 2;
}
message GetCompanyResponse { CompanyDto company = 1; }

message ListCompaniesRequest { string tenant_id = 1; }
message ListCompaniesResponse { repeated CompanyDto companies = 1; }

message ArchiveCompanyRequest {
  string tenant_id = 1;
  string id = 2;
}
message ArchiveCompanyResponse { bool success = 1; }
