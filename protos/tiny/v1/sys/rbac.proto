syntax = "proto3";

package tiny.v1.sys;

// ============ RBAC Service ============

// 角色权限管理服务
service RbacService {
  // 检查权限
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);

  // 列出用户权限
  rpc ListUserPermissions(ListUserPermissionsRequest) returns (ListUserPermissionsResponse);

  // 列出用户角色
  rpc ListUserRoles(ListUserRolesRequest) returns (ListUserRolesResponse);

  // 分配角色
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);

  // 移除角色
  rpc RemoveRole(RemoveRoleRequest) returns (RemoveRoleResponse);

  // 列出所有角色
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  // 列出所有权限
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
}

// ============ Check Permission ============

message CheckPermissionRequest {
  string user_id = 1;       // 用户 UUID
  string resource = 2;      // 资源名称
  string action = 3;        // 操作名称
}

message CheckPermissionResponse {
  bool allowed = 1;          // 是否允许
}

// ============ List User Permissions ============

message ListUserPermissionsRequest {
  string user_id = 1;
}

message ListUserPermissionsResponse {
  repeated PermissionInfo permissions = 1;
}

// ============ List User Roles ============

message ListUserRolesRequest {
  string user_id = 1;
}

message ListUserRolesResponse {
  repeated RoleInfo roles = 1;
}

// ============ Assign / Remove Role ============

message AssignRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message AssignRoleResponse {
  bool success = 1;
}

message RemoveRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message RemoveRoleResponse {
  bool success = 1;
}

// ============ List Roles ============

message ListRolesRequest {}

message ListRolesResponse {
  repeated RoleInfo roles = 1;
}

// ============ List Permissions ============

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated PermissionInfo permissions = 1;
}

// ============ Shared Messages ============

message RoleInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_system = 4;
  bool is_active = 5;
}

message PermissionInfo {
  string id = 1;
  string resource = 2;
  string action = 3;
  string description = 4;
}
