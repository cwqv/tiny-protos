syntax = "proto3";

package tiny.sys.product;

import "tiny/sys/product/product_message.proto";
import "tiny/v1/sys/common.proto";// ============ GetProductRequest ============

message GetProductRequest {
  string id = 1;
}

// ============ GetProductResponse ============

message GetProductResponse {
  Product product = 1;
}

// ============ ListProductsRequest ============

message ListProductsRequest {
  string search_query = 1;  // Search across: [object], [object], [object], [object], [object], [object]
  string name = 3;  // Filter by 产品名称
  string sku = 4;  // Filter by 产品编号（Stock Keeping Unit）
  string description = 5;  // Filter by 产品描述
  string price = 6;  // Filter by 销售价格
  string status = 9;  // Filter by 产品状态
  string category_id = 10;  // Filter by 分类ID
}

// ============ ListProductsResponse ============

message ListProductsResponse {
  repeated Product products = 1;
}

// ============ GetProductsPagedRequest ============

message GetProductsPagedRequest {
  string search_query = 1;
  string name = 3;
  string sku = 4;
  string description = 5;
  string price = 6;
  string status = 9;
  string category_id = 10;
  int32 page = 11;
  int32 page_size = 12;
  string sort_by = 13;
  bool sort_ascending = 14;
}

// ============ GetProductsPagedResponse ============

message GetProductsPagedResponse {
  repeated Product products = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ============ CreateProductRequest ============

message CreateProductRequest {
  string name = 1;
  string sku = 2;
  string description = 3;
  string price = 4;
  string cost_price = 5;
  double discount_percentage = 6;
  string status = 7;
  string category_id = 8;
  repeated string images = 9;
  map<string, string> attributes = 10;
  string internal_notes = 11;
  string deleted_at = 12;
}

// ============ CreateProductResponse ============

message CreateProductResponse {
  Product product = 1;
}

// ============ UpdateProductRequest ============

message UpdateProductRequest {
  string id = 1;
  string name = 2;
  string sku = 3;
  string description = 4;
  string price = 5;
  string cost_price = 6;
  double discount_percentage = 7;
  string status = 8;
  string category_id = 9;
  repeated string images = 10;
  map<string, string> attributes = 11;
  string internal_notes = 12;
  string deleted_at = 13;
}

// ============ UpdateProductResponse ============

message UpdateProductResponse {
  Product product = 1;
}

// ============ DeleteProductRequest ============

message DeleteProductRequest {
  string id = 1;
}

// ============ DeleteProductResponse ============

// Empty response (uses common Empty message)

// ============ BatchDeleteProductsRequest ============

message BatchDeleteProductsRequest {
  repeated string ids = 1;
}

// ============ BatchDeleteProductsResponse ============

message BatchDeleteProductsResponse {
  int32 deleted_count = 1;
}